output_dir = "pdf"
pandoc_defaults = "pandoc/defaults.yaml"
pandoc_image = "genestack-docs-pandoc:latest"
pandoc_dockerfile = "docker/pandoc/Dockerfile"
pandoc_mount_root = "/docs"
hugo_config = "hugo.toml"
version_mode = "auto"
site_base_url = "/"

[[guides]]
slug = "overview"
source = "content/overview"
output = "overview.pdf"
title = "Genestack Overview"

[[guides]]
slug = "design-guide"
source = "content/design-guide"
output = "design-guide.pdf"
title = "Genestack Design Guide"

[[guides]]
slug = "deployment-guide"
source = "content/deployment-guide"
output = "deployment-guide.pdf"
title = "Genestack Deployment Guide"

[[guides]]
slug = "operational-guide"
source = "content/operational-guide"
output = "operational-guide.pdf"
title = "Genestack Operations Guide"

[[guides]]
slug = "cloud-onboarding"
source = "content/cloud-onboarding"
output = "cloud-onboarding.pdf"
title = "Genestack Cloud Onboarding Guide"
